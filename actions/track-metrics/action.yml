name: Track Code Metrics
description: Collect and store code quality metrics for CI/CD pipelines

inputs:
  config-path:
    description: 'Path to umpyre config file'
    default: '.github/umpyre-config.yml'
    required: false
  
  storage-branch:
    description: 'Branch to store metrics on (the default leaves the choice to storage.branch in the config file)'
    default: 'code-metrics'
    required: false
  
  github-token:
    description: 'GitHub token: read by the workflow_status collector and used to push the metrics branch (needs contents: write; with a read-only token the push fails, non-fatally)'
    required: true
  
  force-run:
    description: "Run even if an earlier step of the job failed ('true' or 'false')"
    default: 'false'
    required: false
  
  python-version:
    description: 'Python version to use'
    default: '3.10'
    required: false

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install umpyre and dependencies
      shell: bash
      run: |
        pip install umpyre coverage wily bandit interrogate
    
    - name: Collect and Store Metrics
      # Run on success, or on failure too when `force-run` is 'true'.
      if: ${{ success() || (inputs.force-run == 'true' && !cancelled()) }}
      shell: bash
      env:
        # Inputs reach the script as environment variables, never pasted into it.
        CONFIG_PATH: ${{ inputs.config-path }}
        STORAGE_BRANCH: ${{ inputs.storage-branch }}
        # Used by the workflow_status collector and to push the metrics branch.
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "::group::Collecting Code Metrics"

        # Set up error handling - continue even if collection fails
        set +e

        # Build the command. Run from $RUNNER_TEMP in isolated mode (-I) so that a
        # file in the checked-out repo (umpyre/, yaml.py, ...) can't shadow an
        # installed package; the repository is passed explicitly.
        cmd=(python -I -m umpyre.cli collect --repo-path "$GITHUB_WORKSPACE")
        if [ -n "$CONFIG_PATH" ] && [ -f "$GITHUB_WORKSPACE/$CONFIG_PATH" ]; then
          cmd+=(--config "$GITHUB_WORKSPACE/$CONFIG_PATH")
        elif [ -n "$CONFIG_PATH" ] && [ -f "$CONFIG_PATH" ]; then
          cmd+=(--config "$CONFIG_PATH")
        fi
        # The input's default leaves the choice to the config file (storage.branch).
        if [ -n "$STORAGE_BRANCH" ] && [ "$STORAGE_BRANCH" != "code-metrics" ]; then
          cmd+=(--storage-branch "$STORAGE_BRANCH")
        fi

        (cd "${RUNNER_TEMP:-/tmp}" && "${cmd[@]}")
        EXIT_CODE=$?

        # Report status but don't fail
        if [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Metrics collection completed successfully"
        else
          echo "⚠️ Metrics collection failed with exit code $EXIT_CODE"
          echo "This is informational only - CI pipeline continues"
        fi

        echo "::endgroup::"

        # Always exit successfully to not break CI
        exit 0

branding:
  icon: 'bar-chart-2'
  color: 'blue'
